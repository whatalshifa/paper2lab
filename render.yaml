# Render Blueprint for the Paper2Lab API. In Render: New > Blueprint > pick this repo.
# The website runs on Vercel and the database and PDF bucket on Neon; see docs/DEPLOY.md.
services:
  - type: web
    name: paper2lab-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: P2L_ENV
        value: production
      - key: P2L_STORAGE
        value: s3
      - key: P2L_S3_BUCKET
        value: papers
      - key: P2L_S3_REGION
        value: ap-southeast-1
      # Render asks for these when the Blueprint is first created. To switch on explaining new
      # papers, add ANTHROPIC_API_KEY in the service's Environment tab; without it the site runs
      # as a demo with the sample papers.
      # Copy this value to the Vercel project as API_PROXY_SECRET.
      - key: P2L_PROXY_SECRET
        generateValue: true
      - key: P2L_DATABASE_URL
        sync: false
      - key: P2L_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
