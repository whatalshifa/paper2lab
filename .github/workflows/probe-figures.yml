name: probe-figures
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sample figures from the live site
        run: |
          mkdir -p probe-out
          for pair in 00000000-0000-4000-8000-000000001412:f1 00000000-0000-4000-8000-000000001412:f2 00000000-0000-4000-8000-000000001706:f1 00000000-0000-4000-8000-000000001706:f2 00000000-0000-4000-8000-000000001706:f3; do
            id=${pair%%:*}; fig=${pair##*:}
            for base in https://paper2lab-psi.vercel.app; do
              curl -sS -o probe-out/tmp.png -w "$base $id $fig %{http_code} %{time_total}s %{size_download}B %{content_type}\n" --max-time 120 "$base/api/papers/$id/figures/$fig.png" || echo "$base $id $fig curl failed"
            done
            mkdir -p probe-out/$id && mv probe-out/tmp.png probe-out/$id/$fig.png
          done
          file probe-out/*/*.png
      - name: Save them to this branch
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out && git commit -m "probe output" && git push
